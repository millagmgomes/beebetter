spring.application.name=beebetter
# H2
spring.datasource.url=jdbc:h2:mem:beebetter
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT
jwt.secret=sua-chave-secreta-bem-longa-aqui-minimo-256bits
jwt.expiration=86400000

# limite de tamanho do upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# pasta onde as fotos ficam salvas
app.upload.dir=uploads/profile-pictures
spring.web.resources.static-locations=file:uploads/