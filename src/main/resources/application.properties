spring.application.name=beebetter

spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require

spring.datasource.username=${DATABASE_USER}

spring.datasource.password=${DATABASE_PASSWORD2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.jpa.open-in-view=false

spring.datasource.hikari.connection-init-sql=SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JWT
jwt.secret=sua-chave-secreta-bem-longa-aqui-minimo-256bits
jwt.expiration=86400000

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/profile-pictures
spring.web.resources.static-locations=file:uploads/

# Google
spring.security.oauth2.client.registration.google.client-id=${JWT_SECRET}
spring.security.oauth2.client.registration.google.client-secret=${DATABASE_PASSWORD}
spring.security.oauth2.client.registration.google.scope=email,profile

# Facebook
spring.security.oauth2.client.registration.facebook.client-id=SEU_FACEBOOK_APP_ID
spring.security.oauth2.client.registration.facebook.client-secret=SEU_FACEBOOK_APP_SECRET
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# X (Twitter)
spring.security.oauth2.client.registration.twitter.client-id=SEU_TWITTER_CLIENT_ID
spring.security.oauth2.client.registration.twitter.client-secret=SEU_TWITTER_CLIENT_SECRET
spring.security.oauth2.client.registration.twitter.scope=tweet.read,users.read,offline.access
spring.security.oauth2.client.registration.twitter.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.twitter.redirect-uri={baseUrl}/login/oauth2/code/twitter
spring.security.oauth2.client.provider.twitter.authorization-uri=https://twitter.com/i/oauth2/authorize
spring.security.oauth2.client.provider.twitter.token-uri=https://api.twitter.com/2/oauth2/token
spring.security.oauth2.client.provider.twitter.user-info-uri=https://api.twitter.com/2/users/me
spring.security.oauth2.client.provider.twitter.user-name-attribute=data
